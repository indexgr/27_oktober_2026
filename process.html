<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proses Pembuatan Website</title>

    <meta name="theme-color" content="#0b0a1a">
    <meta name="description" content="Di balik website yang dibuat dengan sepenuh hati.">

    <style>
        /* =========================
           RESET DAN DASAR
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #f5efff;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(103, 76, 173, 0.22),
                    transparent 55%
                ),
                linear-gradient(160deg, #111027, #090914 75%);
            overflow-x: hidden;
        }

        /* =========================
           LATAR BELAKANG
        ========================= */
        .background-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .glow-one {
            top: 15%;
            left: -150px;
            background: #8c62ff;
        }

        .glow-two {
            right: -150px;
            bottom: 10%;
            background: #386bff;
        }

        /* =========================
           HALAMAN UTAMA
        ========================= */
        .page {
            width: 100%;
            min-height: 100vh;
            padding: 65px 24px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* =========================
           JUDUL
        ========================= */
        .heading {
            text-align: center;
            margin-bottom: 42px;
            animation: fade-down 1s ease both;
        }

        .heading h1 {
            font-size: clamp(30px, 5vw, 49px);
            line-height: 1.25;
            font-weight: normal;
            letter-spacing: -1px;
            color: #fffaff;
            text-shadow: 0 0 30px rgba(184, 150, 255, 0.2);
        }

        .heading h1 em {
            color: #c9afff;
            font-weight: normal;
        }

        /* =========================
           GALERI TIGA FOTO
        ========================= */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 3 / 4;
            background: linear-gradient(
                145deg,
                #25213e,
                #131326
            );
            border: 1px solid rgba(213, 192, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.24);
            opacity: 0;
            animation: photo-appear 0.9s ease forwards;
        }

        .photo:nth-child(1) {
            animation-delay: 0.15s;
        }

        .photo:nth-child(2) {
            animation-delay: 0.35s;
        }

        .photo:nth-child(3) {
            animation-delay: 0.55s;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition:
                transform 0.7s ease,
                filter 0.7s ease;
        }

        .photo:hover img {
            transform: scale(1.045);
            filter: brightness(1.06);
        }

        /* =========================
           TOMBOL BACK
        ========================= */
        .back-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 42px;
            animation: fade-up 1s ease 0.6s both;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 46px;
            padding: 12px 25px;
            border: 1px solid rgba(207, 183, 255, 0.42);
            border-radius: 50px;
            color: #e7d9ff;
            background: rgba(132, 102, 196, 0.09);
            font-family: inherit;
            font-size: 15px;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

            background: rgba(132, 102, 196, 0.22);
            border-color: rgba(219, 202, 255, 0.8);
